name: CIRCULO IA — Test suite

on:
  push:
    branches:
      - fix/messenger-human-contact-routing
  pull_request:
    branches:
      - feat/messaging-unified-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
