name: AXIAL NETWORK - Resilience Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      AXIAL_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require non-production Upstash credentials
        shell: bash
        run: |
          if [[ -z "$UPSTASH_REDIS_REST_URL" || -z "$UPSTASH_REDIS_REST_TOKEN" ]]; then
            echo "::error::Configure UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN as GitHub Actions secrets for a dedicated non-production Upstash database."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Redis resilience suite
        run: npm run test:resilience
