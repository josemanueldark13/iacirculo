name: Círculo IA - Regresión 30

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**.md'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run full test suite
        run: npm test
